<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxiSense</title>
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg: #050a08; --panel: #0b1410; --line: #1b4a30; --text: #b8ffc9; --muted: #6f9a80;
    --accent: #42ff83; --danger: #ff5a5a; --warn: #ffb020; --cell-off: #0b1410;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { margin: 0; font: 700 20px var(--mono); letter-spacing: .12em; color: var(--accent); }
  h2 { margin: 0 0 12px; font: 600 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .two { grid-template-columns: 1fr; margin-bottom: 16px; }
  @media (min-width: 860px) { .two { grid-template-columns: 1fr 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font: 600 12px var(--mono); border: 1px solid currentColor; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .on { color: var(--accent); } .off { color: var(--warn); } .bad { color: var(--danger); }
  .card h3 { margin: 0 0 4px; font: 700 17px var(--mono); overflow-wrap: anywhere; }
  .card dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .card dt { color: var(--muted); } .card dd { margin: 0; font-family: var(--mono); text-align: right; white-space: nowrap; }
  .heat { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; max-width: 460px; margin: 0 auto; }
  .cell { aspect-ratio: 1; display: grid; place-items: center; border-radius: 4px; font: 600 clamp(9px, 2.2vw, 12px) var(--mono); color: #04110a; background: var(--cell-off); }
  .cell.none { color: #2d4a3a; }
  .cell.near { outline: 2px solid var(--danger); outline-offset: -2px; }
  .legend { display: flex; align-items: center; gap: 8px; margin: 12px auto 0; max-width: 460px; font: 12px var(--mono); color: var(--muted); }
  .legend i { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #f5e663, #3dbb7a 50%, #46327e); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 13px var(--mono); margin-bottom: 12px; }
  .empty { color: var(--muted); padding: 8px 0; }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--muted); font: 10px var(--mono); }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  td.num { font-family: var(--mono); text-align: right; } td.msg { white-space: normal; min-width: 160px; color: var(--muted); }
  .badge { font: 700 11px var(--mono); padding: 2px 8px; border-radius: 4px; }
  .badge.alert { background: #3a1212; color: var(--danger); } .badge.presence { background: #3a2a08; color: var(--warn); } .badge.info { background: #11261a; color: var(--accent); }
  @media (max-width: 600px) {
    main { padding: 12px; } .panel { padding: 12px; }
    .card h3 { font-size: 15px; } .card dl { font-size: 13px; }
    thead { display: none; } table, tbody { display: block; }
    tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    td { border: 0; padding: 0; white-space: normal; }
    td:nth-child(1) { grid-column: 1; grid-row: 1; } td:nth-child(3) { grid-column: 2; grid-row: 1; }
    td:nth-child(2) { grid-column: 1; grid-row: 2; color: var(--muted); font-size: 13px; }
    td:nth-child(4) { grid-column: 2; grid-row: 2; } td.msg { grid-column: 1 / -1; grid-row: 3; min-width: 0; font-size: 13px; }
  }
  footer { color: var(--muted); font: 12px var(--mono); margin-top: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>PROXISENSE</h1>
    <span id="link" class="pill off" role="status">Conectando…</span>
  </header>

  <section class="grid cards" id="devices" aria-label="Dispositivos"></section>

  <div class="grid two">
    <section class="panel" aria-label="Mapa de calor">
      <h2>Mapa de calor 8×8</h2>
      <select id="pick" aria-label="Dispositivo" hidden></select>
      <div class="heat" id="heat"></div>
      <div class="legend"><span>cerca</span><i></i><span>2 m +</span></div>
      <p class="empty" id="heatnote" style="text-align:center;margin:8px 0 0"></p>
    </section>

    <section class="panel" aria-label="Actividad">
      <h2>Actividad · últimas 24 h</h2>
      <div id="chart"></div>
    </section>
  </div>

  <section class="panel" aria-label="Eventos recientes">
    <h2>Eventos recientes</h2>
    <div class="wrap"><table>
      <thead><tr><th>Hora</th><th>Dispositivo</th><th>Tipo</th><th style="text-align:right">Distancia</th><th>Detalle</th></tr></thead>
      <tbody id="events"></tbody>
    </table></div>
    <p class="empty" id="noevents" hidden>Sin eventos todavía.</p>
  </section>

  <footer>Se actualiza cada 2 segundos. Las horas se muestran en la zona horaria de este navegador.</footer>
</main>

<script>
"use strict";
const NEAR_MM = 1500;      // contorno rojo: distancia de alerta del monitor
const FAR_MM = 2000;
let data = null, fetchedAt = 0, selected = null;

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); };
const ago = s => s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.floor(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h` : `${Math.floor(s / 86400)} d`;
const fmtTime = iso => new Date(iso).toLocaleString(undefined, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const mm = v => v == null ? "—" : `${Math.round(v)} mm`;

// cerca = amarillo, medio = verde, lejos = morado (como el radar)
const STOPS = [[245, 230, 99], [61, 187, 122], [70, 50, 126]];
function heatColor(d) {
  const t = Math.min(1, Math.max(0, d / FAR_MM)) * 2, i = Math.min(1, Math.floor(t)), f = t - i;
  const c = STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function renderDevices() {
  const box = document.getElementById("devices"); clear(box);
  if (!data.devices.length) { const p = el("p", "panel empty", "Aún no ha llegado ningún dispositivo. Revisa la clave y la dirección del servidor en el monitor."); box.appendChild(p); return; }
  const drift = (Date.now() - fetchedAt) / 1000;
  for (const d of data.devices) {
    const card = el("article", "panel card");
    card.appendChild(el("h3", "", d.device));
    const online = d.online && drift < 30;
    card.appendChild(el("span", "pill " + (online ? "on" : "off"), online ? "EN LÍNEA" : "SIN SEÑAL"));
    const dl = el("dl");
    for (const [k, v] of [["Visto", `hace ${ago(d.seconds_ago + drift)}`], ["Más cercano", mm(d.nearest_mm)], ["Celdas cerca", d.cells_near == null ? "—" : String(d.cells_near)]]) { dl.appendChild(el("dt", "", k)); dl.appendChild(el("dd", "", v)); }
    card.appendChild(dl); box.appendChild(card);
  }
}

function renderHeat() {
  const pick = document.getElementById("pick"), heat = document.getElementById("heat"), note = document.getElementById("heatnote");
  const withFrame = data.devices.filter(d => d.frame);
  pick.hidden = withFrame.length < 2;
  if (!pick.hidden) {
    const names = withFrame.map(d => d.device);
    if (pick.options.length !== names.length || names.some((n, i) => pick.options[i].value !== n)) { clear(pick); names.forEach(n => { const o = el("option", "", n); o.value = n; pick.appendChild(o); }); }
    if (!names.includes(selected)) selected = names[0];
    pick.value = selected;
  }
  const dev = withFrame.find(d => d.device === selected) || withFrame[0];
  clear(heat);
  if (!dev) { note.textContent = "Ningún dispositivo ha enviado una matriz todavía (los sensores de una sola distancia no la envían)."; return; }
  note.textContent = `Contorno rojo: ${NEAR_MM} mm o menos. Dispositivo: ${dev.device}`;
  dev.frame.forEach(v => {
    const valid = v > 0 && v < 4000, c = el("div", "cell" + (valid ? "" : " none") + (valid && v <= NEAR_MM ? " near" : ""), valid ? String(Math.round(v)) : "—");
    if (valid) c.style.background = heatColor(v);
    heat.appendChild(c);
  });
}

function renderChart() {
  const box = document.getElementById("chart"); clear(box);
  const h = data.hourly, max = Math.max(1, ...h.map(b => b.alerts + b.presences));
  if (h.every(b => b.alerts + b.presences === 0)) { box.appendChild(el("p", "empty", "Sin actividad en las últimas 24 horas.")); return; }
  const W = 480, H = 160, base = 138, bw = W / h.length, ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Alertas y detecciones silenciadas por hora");
  const rect = (x, y, w, hh, fill) => { const r = document.createElementNS(ns, "rect"); r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", w); r.setAttribute("height", hh); r.setAttribute("rx", 2); r.setAttribute("fill", fill); svg.appendChild(r); };
  h.forEach((b, i) => {
    const ha = (b.alerts / max) * 110, hp = (b.presences / max) * 110;
    rect(i * bw + 2, base - ha, bw - 4, ha, "#ff5a5a"); rect(i * bw + 2, base - ha - hp, bw - 4, hp, "#ffb020");
    if (i % 6 === 0) { const t = document.createElementNS(ns, "text"); t.setAttribute("x", i * bw + 2); t.setAttribute("y", 154); t.textContent = new Date(b.hour_start).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); svg.appendChild(t); }
  });
  const axis = document.createElementNS(ns, "line"); [["x1", 0], ["x2", W], ["y1", base + .5], ["y2", base + .5]].forEach(([k, v]) => axis.setAttribute(k, v)); axis.setAttribute("stroke", "#1b4a30"); svg.appendChild(axis);
  box.appendChild(svg);
  const a = h.reduce((n, b) => n + b.alerts, 0), p = h.reduce((n, b) => n + b.presences, 0);
  box.appendChild(el("p", "", `Total 24 h: ${a} alerta${a === 1 ? "" : "s"} enviada${a === 1 ? "" : "s"} · ${p} silenciada${p === 1 ? "" : "s"}`));
  box.appendChild(el("p", "empty", "Rojo: alertas enviadas · Ámbar: detecciones silenciadas (privacidad)"));
}

function renderEvents() {
  const body = document.getElementById("events"); clear(body);
  document.getElementById("noevents").hidden = data.events.length > 0;
  const label = { alert: "ALERTA", presence: "SILENCIADA", info: "INFO" };
  for (const e of data.events) {
    const tr = el("tr"), badge = el("span", "badge " + e.kind, label[e.kind] || e.kind), td = el("td"); td.appendChild(badge);
    tr.appendChild(el("td", "", fmtTime(e.ts))); tr.appendChild(el("td", "", e.device)); tr.appendChild(td);
    tr.appendChild(el("td", "num", mm(e.distance_mm))); tr.appendChild(el("td", "msg", e.message || "")); body.appendChild(tr);
  }
}

function setLink(ok) { const l = document.getElementById("link"); l.className = "pill " + (ok ? "on" : "bad"); l.textContent = ok ? `Actualizado ${new Date().toLocaleTimeString()}` : "Sin conexión con el servidor"; }

async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); fetchedAt = Date.now(); setLink(true);
    renderDevices(); renderHeat(); renderChart(); renderEvents();
  } catch (e) { setLink(false); }
}
document.getElementById("pick").addEventListener("change", e => { selected = e.target.value; if (data) renderHeat(); });
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>

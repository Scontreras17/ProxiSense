[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxisense"
version = "1.0.0"
description = "LiDAR 8x8 por puerto serie: radar en tiempo real, registro CSV y alertas de presencia por Telegram."
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pyserial>=3.5", "requests>=2.31"]

[project.scripts]
test-radar = "test_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
